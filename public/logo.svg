<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0c0e17" stroke="#1e293d" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#radarGlow)"/>

  <!-- Radar Rings -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
  <circle cx="50" cy="50" r="8" fill="#10b981" filter="url(#glow)"/>

  <!-- Tactical Reticle Lines -->
  <line x1="50" y1="12" x2="50" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="88" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="24" y2="50" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="88" y2="50" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Emblem (Aqliya Letter 'Ain' / Core Diamond) -->
  <polygon points="50,28 66,50 50,72 34,50" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="3.5" fill="#f59e0b"/>
</svg>
